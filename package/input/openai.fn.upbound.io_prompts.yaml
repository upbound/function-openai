---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: prompts.openai.fn.upbound.io
spec:
  group: openai.fn.upbound.io
  names:
    categories:
    - crossplane
    kind: Prompt
    listKind: PromptList
    plural: prompts
    singular: prompt
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Prompt can be used to provide input to this Function.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          maxTokens:
            description: |-
              MaxTokens caps how many tokens the model may generate in reply.

              This matters most against a self-hosted engine. Without a cap, an
              OpenAI-compatible server generates until it exhausts its context window:
              llama.cpp reports "decode() failed: Context size has been exceeded" and
              the function blocks until the request finally ends, which on CPU
              inference can hang an Operation for many minutes. Hosted APIs apply
              their own default, which is why this went unnoticed.

              Defaults to 1024 when unset, which is ample for a structured reply.
            type: integer
          metadata:
            type: object
          systemPrompt:
            description: SystemPrompt to send to GPT.
            type: string
          userPrompt:
            description: UserPrompt to send to GPT.
            type: string
        required:
        - systemPrompt
        - userPrompt
        type: object
    served: true
    storage: true
